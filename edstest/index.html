<!DOCTYPE html>
<html>
<head>
    <title>EDS Chatbot</title>
</head>

<body>

    <div id="conversation"></div>

    <input
        type="text"
        id="question"
        placeholder="Ask a question..."
    >

    <button id="sendButton" onclick="askQuestion()">Ask</button>

    <script>

        async function askQuestion() {

            const questionInput = document.getElementById("question");
            const question = questionInput.value.trim();
            const conversation = document.getElementById("conversation");
            const sendButton = document.getElementById("sendButton");

            if (question === "") {
                return;
            }

            // Disable the button while the question is processing
            sendButton.disabled = true;

            // Show the user's message
            const userMessage = document.createElement("p");
            userMessage.textContent = "You: " + question;
            conversation.appendChild(userMessage);

            // Clear the input box
            questionInput.value = "";

            // Display loading status
            const aiMessage = document.createElement("p");
            aiMessage.textContent = "EDS: Thinking...";
            conversation.appendChild(aiMessage);

            try {

                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                // Replace loading status with the AI response
                aiMessage.textContent = "EDS: " + data.answer;

            } catch (error) {

                // Replace loading status with an error message
                aiMessage.textContent = "EDS: Unable to get a response.";
                console.error(error);

            } finally {

                // Re-enable the button when processing finishes
                sendButton.disabled = false;
                questionInput.focus();
            }
        }

    </script>

</body>
</html>
