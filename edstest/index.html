<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="script.js" defer></script>
    <title>EDS Chatbot Prototype</title>

 
</head>

<body>

    <button
        id="chatLauncher"
        type="button"
        aria-label="Open EDS chatbot"
        aria-controls="chatPanel"
        aria-expanded="false"
    >
        &#128172;
    </button>


    <section
        id="chatPanel"
        aria-label="EDS chatbot"
        hidden
    >

        <header id="chatHeader">
            <div id="chatTitle">
            <h2>EDS Chatbot</h2>
            <p>Ask EDS a question</p>
        </div>
            

            <button
                id="closeChat"
                type="button"
                aria-label="Close EDS chatbot"
            >
                &times;
            </button>
            

        </header>


        <section
            id="conversation"
            role="log"
            aria-live="polite"
            aria-relevant="additions text"
            aria-label="Chat conversation"
        >
            <p class="eds-message">
                <span class="ai-response">
                    Hello! I can answer questions using information from the EDS knowledge base, including publications, reports and submissions. 
                    I may not be able to answer questions outside the available EDS information. How can I help you today?
                </span>
            </p>
        </section>


        <form id="chatForm">

            <label
                for="question"
                class="visuallyHidden"
            >
                Ask EDS a question
            </label>

            <input
                type="text"
                id="question"
                placeholder="Ask a question..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="submit"
            >
                Ask EDS
            </button>

        </form>

    </section>


</body>
</html>
