<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EDS Chatbot Prototype</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Floating chat launcher */
        #chatLauncher {
            position: fixed;
            right: 24px;
            bottom: 24px;

            width: 64px;
            height: 64px;

            border: none;
            border-radius: 50%;

            background-color: #007a9e;
            color: white;

            font-size: 28px;
            cursor: pointer;

            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);

            z-index: 1001;
        }

        #chatLauncher:hover {
            background-color: #00607c;
        }

        /* Chat panel */
        #chatPanel {
            position: fixed;

            right: 24px;
            bottom: 100px;

            width: 400px;
            height: 600px;

            max-height: calc(100vh - 130px);

            background-color: white;

            border-radius: 14px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.25);

            overflow: hidden;

            display: flex;
            flex-direction: column;

            z-index: 1000;
        }

        #chatPanel[hidden] {
            display: none;
        }

        /* Header */
        #chatHeader {
            background-color: #007a9e;
            color: white;

            padding: 14px 16px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chatHeader h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        #closeChat {
            border: none;
            background: transparent;

            color: white;

            font-size: 28px;
            line-height: 1;

            cursor: pointer;
        }

        /* Conversation */
        #conversation {
            flex: 1;

            padding: 16px;

            overflow-y: auto;
            overflow-wrap: anywhere;

            background-color: white;
        }

        #conversation p {
            line-height: 1.4;
        }

        /* Question form */
        #chatForm {
            border-top: 1px solid #ddd;

            padding: 12px;

            display: flex;
            gap: 8px;

            background-color: #f7f7f7;
        }

        .visuallyHidden {
            position: absolute;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: -1px;

            overflow: hidden;
            clip: rect(0, 0, 0, 0);

            white-space: nowrap;
            border: 0;
        }

        #question {
            flex: 1;
            min-width: 0;

            padding: 10px;

            font-size: 16px;

            border: 1px solid #aaa;
            border-radius: 6px;
        }

        #sendButton {
            padding: 10px 14px;

            font-size: 15px;

            cursor: pointer;

            border: none;
            border-radius: 6px;

            background-color: #007a9e;
            color: white;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 2px;
        }

        a {
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            #chatLauncher {
                right: 16px;
                bottom: 16px;
            }

            #chatPanel {
                right: 12px;
                bottom: 92px;

                width: calc(100vw - 24px);
                height: 72vh;

                max-height: none;
            }

            #chatForm {
                flex-direction: column;
            }

            #question,
            #sendButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <button
        id="chatLauncher"
        type="button"
        aria-label="Open EDS chatbot"
        aria-controls="chatPanel"
        aria-expanded="false"
    >
        &#128172;
    </button>


    <section
        id="chatPanel"
        aria-label="EDS chatbot"
        hidden
    >

        <header id="chatHeader">

            <h2>EDS Chatbot</h2>

            <button
                id="closeChat"
                type="button"
                aria-label="Close EDS chatbot"
            >
                &times;
            </button>

        </header>


        <section
            id="conversation"
            role="log"
            aria-live="polite"
            aria-relevant="additions text"
            aria-label="Chat conversation"
        ></section>


        <form id="chatForm">

            <label
                for="question"
                class="visuallyHidden"
            >
                Ask EDS a question
            </label>

            <input
                type="text"
                id="question"
                placeholder="Ask a question..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="submit"
            >
                Ask EDS
            </button>

        </form>

    </section>


    <script>
        const chatLauncher =
            document.getElementById("chatLauncher");

        const chatPanel =
            document.getElementById("chatPanel");

        const closeChatButton =
            document.getElementById("closeChat");

        const questionInput =
            document.getElementById("question");


        function openChat() {
            chatPanel.hidden = false;

            chatLauncher.setAttribute(
                "aria-expanded",
                "true"
            );

            questionInput.focus();
        }


        function closeChat() {
            chatPanel.hidden = true;

            chatLauncher.setAttribute(
                "aria-expanded",
                "false"
            );

            chatLauncher.focus();
        }


        chatLauncher.addEventListener(
            "click",
            function() {
                if (chatPanel.hidden) {
                    openChat();
                } else {
                    closeChat();
                }
            }
        );


        closeChatButton.addEventListener(
            "click",
            closeChat
        );


        document.addEventListener(
            "keydown",
            function(event) {
                if (
                    event.key === "Escape" &&
                    !chatPanel.hidden
                ) {
                    closeChat();
                }
            }
        );


        async function askQuestion() {
            const question =
                questionInput.value.trim();

            const conversation =
                document.getElementById(
                    "conversation"
                );

            const sendButton =
                document.getElementById(
                    "sendButton"
                );

            if (question === "") {
                return;
            }


            sendButton.disabled = true;


            /* User message */

            const userMessage =
                document.createElement("p");

            const userLabel =
                document.createElement("strong");

            userLabel.textContent = "You: ";

            userMessage.appendChild(userLabel);

            userMessage.appendChild(
                document.createTextNode(question)
            );

            conversation.appendChild(
                userMessage
            );


            questionInput.value = "";


            /* AI loading message */

            const aiMessage =
                document.createElement("p");

            const aiLabel =
                document.createElement("strong");

            aiLabel.textContent = "EDS: ";

            const aiText =
                document.createElement("span");

            aiText.textContent = "Thinking...";

            aiMessage.appendChild(aiLabel);
            aiMessage.appendChild(aiText);

            conversation.appendChild(
                aiMessage
            );


            conversation.scrollTop =
                conversation.scrollHeight;


            try {
                const response =
                    await fetch(
                        "http://127.0.0.1:8000/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    question: question
                                })
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "Server returned an error"
                    );
                }


                const data =
                    await response.json();


                /* Unanswered question */

                if (data.unanswered) {
                    aiText.textContent =
                        "I couldn't find relevant information in the EDS knowledge base to answer this question.";

                    aiMessage.style.backgroundColor =
                        "#f8d7da";

                    aiMessage.style.border =
                        "1px solid #f1aeb5";

                    aiMessage.style.padding =
                        "10px";

                    aiMessage.style.fontWeight =
                        "bold";

                } else {
                    aiText.textContent =
                        data.answer;
                }


                /* Low-confidence warning */

                if (
                    data.low_confidence &&
                    !data.unanswered
                ) {
                    const warning =
                        document.createElement("p");

                    warning.setAttribute(
                        "role",
                        "status"
                    );

                    warning.textContent =
                        "Warning: This answer may not be fully supported by the available EDS information.";

                    warning.style.backgroundColor =
                        "#fff3cd";

                    warning.style.border =
                        "1px solid #ffe69c";

                    warning.style.padding =
                        "10px";

                    warning.style.fontWeight =
                        "bold";

                    conversation.appendChild(
                        warning
                    );
                }


                /* Sources */

                if (
                    data.sources &&
                    data.sources.length > 0
                ) {
                    const sourcesContainer =
                        document.createElement(
                            "div"
                        );

                    const sourcesTitle =
                        document.createElement(
                            "strong"
                        );

                    sourcesTitle.textContent =
                        "Sources:";

                    sourcesContainer.appendChild(
                        sourcesTitle
                    );


                    const sourcesList =
                        document.createElement(
                            "ul"
                        );


                    data.sources.forEach(
                        function(source) {

                            const sourceItem =
                                document.createElement(
                                    "li"
                                );


                            const title =
                                document.createElement(
                                    "span"
                                );

                            title.textContent =
                                source.document;

                            sourceItem.appendChild(
                                title
                            );


                            if (
                                source.page !== undefined &&
                                source.page !== null
                            ) {
                                const page =
                                    document.createElement(
                                        "span"
                                    );

                                page.textContent =
                                    " - Page " +
                                    source.page;

                                sourceItem.appendChild(
                                    page
                                );
                            }


                            if (source.url) {
                                const separator =
                                    document.createTextNode(
                                        " - "
                                    );

                                sourceItem.appendChild(
                                    separator
                                );


                                const link =
                                    document.createElement(
                                        "a"
                                    );

                                link.href =
                                    source.url;

                                link.textContent =
                                    "Open source";

                                link.target =
                                    "_blank";

                                link.rel =
                                    "noopener noreferrer";

                                link.setAttribute(
                                    "aria-label",
                                    "Open source: " +
                                    source.document
                                );

                                sourceItem.appendChild(
                                    link
                                );
                            }


                            sourcesList.appendChild(
                                sourceItem
                            );
                        }
                    );


                    sourcesContainer.appendChild(
                        sourcesList
                    );

                    conversation.appendChild(
                        sourcesContainer
                    );
                }


            } catch (error) {
                aiText.textContent =
                    "Sorry, something went wrong while processing your question. Please try again.";

                console.error(error);


            } finally {
                sendButton.disabled =
                    false;

                questionInput.focus();

                conversation.scrollTop =
                    conversation.scrollHeight;
            }
        }


        document
            .getElementById("chatForm")
            .addEventListener(
                "submit",
                function(event) {
                    event.preventDefault();

                    askQuestion();
                }
            );
    </script>

</body>
</html>
