<!DOCTYPE html>
<html>
<head>
    <title>EDS Chatbot</title>
</head>

<body>

    <div id="conversation"></div>

    <input
        type="text"
        id="question"
        placeholder="Ask a question..."
    >

    <button id="sendButton" onclick="askQuestion()">Ask</button>

    <script>

        async function askQuestion() {

            const questionInput = document.getElementById("question");
            const question = questionInput.value.trim();
            const conversation = document.getElementById("conversation");
            const sendButton = document.getElementById("sendButton");

            if (question === "") {
                return;
            }

            // Disable the button while the question is processing
            sendButton.disabled = true;

            // Show the user's message
            const userMessage = document.createElement("p");
            userMessage.textContent = "You: " + question;
            conversation.appendChild(userMessage);

            // Clear the input box
            questionInput.value = "";

            // Display loading status
            const aiMessage = document.createElement("p");
            aiMessage.textContent = "EDS: Thinking...";
            conversation.appendChild(aiMessage);

            try {

                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                });

                if (!response.ok) {
                     throw new Error("Server returned an error");
                }

                const data = await response.json();

                // Replace loading status with the AI response
                aiMessage.textContent = "EDS: " + data.answer;
                if (data.low_confidence) {

                const warning = document.createElement("p");

                warning.textContent =
                    "Warning: This answer may not be fully supported by the available EDS information.";

                warning.style.backgroundColor = "#fff3cd";
                warning.style.border = "1px solid #ffe69c";
                warning.style.padding = "10px";
                warning.style.fontWeight = "bold";

                    conversation.appendChild(warning);
                }

                // Display sources below the relevant answer
                if (data.sources && data.sources.length > 0) {

                    const sourcesContainer = document.createElement("div");

                    const sourcesTitle = document.createElement("strong");
                    sourcesTitle.textContent = "Sources:";
                    sourcesContainer.appendChild(sourcesTitle);

                    const sourcesList = document.createElement("ul");

                    data.sources.forEach(function(source) {

                    const sourceItem = document.createElement("li");

                    // Document title
                    const title = document.createElement("span");
                    title.textContent = source.document;
                    sourceItem.appendChild(title);

                    // Page number, if available
                    if (source.page !== undefined && source.page !== null) {
                        const page = document.createElement("span");
                        page.textContent = " - Page " + source.page;
                        sourceItem.appendChild(page);
                    }

                    // URL, if available
                    if (source.url) {

                        const separator = document.createTextNode(" - ");
                        sourceItem.appendChild(separator);

                        const link = document.createElement("a");
                        link.href = source.url;
                        link.textContent = "Open source";
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";

                        sourceItem.appendChild(link);
                    }

                    sourcesList.appendChild(sourceItem);
                });

                sourcesContainer.appendChild(sourcesList);
                conversation.appendChild(sourcesContainer);
            }

            } catch (error) {

                aiMessage.textContent =
                    "EDS: Sorry, something went wrong while processing your question. Please try again.";

                console.error(error);

            } finally {

                sendButton.disabled = false;
                questionInput.focus();
            }
        }

    </script>

</body>
</html>
